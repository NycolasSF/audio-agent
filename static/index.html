<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AudioAgent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0c0e18;
      --surface:     #13162a;
      --surface2:    #1a1e35;
      --surface3:    #20253f;
      --border:      #252a45;
      --border2:     #2e3560;
      --accent:      #7c6fff;
      --accent-dim:  rgba(124,111,255,.15);
      --record:      #ff4060;
      --record-dim:  rgba(255,64,96,.18);
      --record-glow: rgba(255,64,96,.40);
      --wave:        #9d8fff;
      --green:       #3ddc84;
      --green-dim:   rgba(61,220,132,.12);
      --yellow:      #ffc94d;
      --text:        #eef0f8;
      --text-dim:    #7880a0;
      --text-muted:  #454e72;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: .95rem; font-weight: 800; letter-spacing: .06em; flex: 1; }
    .logo em { color: var(--accent); font-style: normal; }

    .device-chip {
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      color: var(--text-dim);
      letter-spacing: .06em;
    }
    .device-chip.cuda { border-color: var(--green); color: var(--green); background: var(--green-dim); }

    .conn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background .4s;
      flex-shrink: 0;
    }
    .conn-dot.online { background: var(--green); }

    .model-select {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text-dim);
      font-size: .78rem;
      padding: 5px 9px;
      cursor: pointer;
      outline: none;
    }
    .model-select:focus { border-color: var(--accent); }

    /* ── MAIN ───────────────────────────────── */
    main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 32px;
      gap: 0;
    }
    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── RECORDING CARD ─────────────────────── */
    .rec-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
      transition: border-color .3s, box-shadow .3s;
    }
    .rec-card.recording {
      border-color: var(--record);
      box-shadow: 0 0 32px rgba(255,64,96,.1);
    }

    /* Waveform */
    .waveform { display: flex; align-items: center; gap: 4px; height: 44px; }
    .waveform .bar {
      width: 4px; border-radius: 3px;
      background: var(--border2); height: 8px;
      transition: background .3s;
    }
    .waveform.active .bar {
      background: var(--wave);
      animation: wave var(--dur,.9s) ease-in-out infinite alternate;
    }
    @keyframes wave { 0% { height: 6px; } 100% { height: var(--peak,32px); } }

    /* Timer */
    .timer {
      font-size: 2.4rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em; line-height: 1;
      transition: color .3s;
    }
    .rec-card.recording .timer { color: var(--record); }

    /* Record button */
    .rec-btn {
      width: 80px; height: 80px; border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--accent-dim);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .25s; position: relative;
    }
    .rec-btn:hover { transform: scale(1.05); }
    .rec-btn:active { transform: scale(.96); }
    .rec-btn .icon {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent); transition: all .25s;
    }
    .rec-btn.recording {
      background: var(--record-dim); border-color: var(--record);
      animation: btn-pulse 1.8s ease-in-out infinite;
    }
    .rec-btn.recording .icon {
      background: var(--record); border-radius: 5px;
      width: 24px; height: 24px;
    }
    @keyframes btn-pulse {
      0%,100% { box-shadow: 0 0 0 0 var(--record-glow); }
      50%      { box-shadow: 0 0 0 14px transparent; }
    }
    .rec-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; animation: none; }

    /* Status pill */
    .status-pill {
      font-size: .72rem; font-weight: 600;
      letter-spacing: .05em; text-transform: uppercase;
      padding: 4px 11px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); transition: all .3s;
    }
    .status-pill.recording { background: var(--record-dim); border-color: var(--record); color: var(--record); }

    .device-label {
      font-size: .76rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .device-label svg { opacity: .5; flex-shrink: 0; }

    /* ── HISTORY ────────────────────────────── */
    .history-header {
      display: flex; align-items: center; gap: 10px;
      margin-top: 28px; margin-bottom: 14px; flex-shrink: 0;
    }
    .history-title {
      font-size: .7rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .history-line { flex: 1; height: 1px; background: var(--border); }
    .history-count {
      font-size: .72rem; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 2px 9px;
    }

    .empty-state {
      text-align: center; color: var(--text-muted);
      font-size: .84rem; padding: 36px 0 12px;
      line-height: 1.7; flex-shrink: 0;
    }
    .empty-state svg { opacity: .25; display: block; margin: 0 auto 10px; }

    /* ── TRANSCRIPTION CARDS ────────────────── */
    #transcriptions { display: flex; flex-direction: column; gap: 12px; }

    .t-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: visible;
      animation: slideIn .25s ease;
      flex-shrink: 0;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .t-card-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .lang-badge {
      font-size: .68rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 6px;
      background: var(--accent-dim); border: 1px solid rgba(124,111,255,.3);
      color: var(--accent); flex-shrink: 0;
    }
    .lang-badge.pending { background: var(--surface2); border-color: var(--border); color: var(--text-muted); }

    .t-meta {
      display: flex; align-items: center; gap: 6px;
      flex: 1; font-size: .76rem; color: var(--text-dim);
      min-width: 0;
    }
    .t-meta .sep { color: var(--text-muted); }
    .dur-badge {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface2); border-radius: 5px;
      padding: 2px 7px; font-size: .72rem; flex-shrink: 0;
    }
    .t-model {
      font-size: .68rem; color: var(--text-muted);
      background: var(--surface2); border-radius: 5px;
      padding: 2px 7px; flex-shrink: 0;
    }
    .t-device {
      font-size: .65rem; font-weight: 700;
      padding: 2px 6px; border-radius: 5px; flex-shrink: 0;
      color: var(--green); background: var(--green-dim);
    }
    .t-device.cpu { color: var(--text-muted); background: var(--surface2); font-weight: 400; }

    /* copy button */
    .copy-btn {
      background: none; border: 1px solid var(--border2);
      border-radius: 6px; color: var(--text-dim);
      font-size: .72rem; padding: 4px 10px;
      cursor: pointer; transition: all .2s; flex-shrink: 0;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--green); color: var(--green); }

    /* download dropdown */
    .dl-wrap { position: relative; flex-shrink: 0; }
    .dl-btn {
      background: none; border: 1px solid var(--border2);
      border-radius: 6px; color: var(--text-dim);
      font-size: .72rem; padding: 4px 10px;
      cursor: pointer; transition: all .2s;
    }
    .dl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .dl-menu {
      position: absolute; right: 0; top: calc(100% + 4px);
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 8px; padding: 4px;
      display: flex; flex-direction: column; gap: 2px;
      min-width: 110px; z-index: 50;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .dl-menu button {
      background: none; border: none; border-radius: 5px;
      color: var(--text-dim); font-size: .78rem;
      padding: 7px 12px; text-align: left; cursor: pointer;
      transition: background .15s, color .15s;
    }
    .dl-menu button:hover { background: var(--surface3); color: var(--text); }

    /* progress bar */
    .t-progress-area { padding: 14px; }
    .t-progress-wrap {
      position: relative; height: 6px;
      background: var(--surface2); border-radius: 3px;
      overflow: hidden; margin-bottom: 6px;
    }
    .t-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--wave));
      border-radius: 3px;
      width: 0%;
      transition: width .35s ease;
    }
    .t-progress-label {
      font-size: .72rem; color: var(--accent);
      text-align: right; display: block;
    }

    /* card body */
    .t-card-body { padding: 14px; }
    .t-text {
      font-size: .9rem; line-height: 1.65;
      color: var(--text); white-space: pre-wrap; word-break: break-word;
    }
    .t-text.empty { color: var(--text-muted); font-style: italic; }

    /* error state */
    .t-card.error { border-color: var(--record); }
    .t-error-msg { padding: 14px; font-size: .84rem; color: var(--record); }

    /* ── TITLE BAR ──────────────────────────── */
    .t-title-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .t-title-icon { color: var(--text-muted); flex-shrink: 0; opacity: .5; }
    .t-title {
      flex: 1; font-size: .82rem; color: var(--text-dim);
      outline: none; cursor: text;
      border-radius: 4px; padding: 2px 6px;
      transition: background .2s, color .2s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .t-title:focus { background: var(--surface3); color: var(--text); white-space: normal; }
    .t-title:empty::before { content: attr(data-placeholder); color: var(--text-muted); font-style: italic; }

    .del-btn {
      background: none; border: 1px solid transparent;
      border-radius: 6px; color: var(--text-muted);
      font-size: .8rem; padding: 4px 8px; cursor: pointer;
      transition: all .2s; flex-shrink: 0;
    }
    .del-btn:hover { border-color: var(--record); color: var(--record); }

    /* ── TOAST ──────────────────────────────── */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 10px; padding: 10px 18px;
      font-size: .82rem; color: var(--text);
      pointer-events: none;
      transition: transform .3s ease, opacity .3s ease;
      opacity: 0; z-index: 100; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.error { border-color: var(--record); color: var(--record); }
  </style>
</head>
<body>

<header>
  <div class="logo">Audio<em>Agent</em></div>
  <div class="device-chip" id="device-chip">CPU</div>
  <select class="model-select" id="model-select">
    <option value="tiny">Whisper tiny</option>
    <option value="base" selected>Whisper base</option>
    <option value="small">Whisper small</option>
    <option value="medium">Whisper medium</option>
    <option value="large">Whisper large</option>
  </select>
  <div class="conn-dot" id="conn-dot"></div>
</header>

<main>
  <div class="rec-card" id="rec-card">
    <div class="waveform" id="waveform"></div>
    <div class="timer" id="timer">00:00</div>
    <button class="rec-btn" id="rec-btn">
      <div class="icon"></div>
    </button>
    <div class="status-pill" id="status-pill">Pronto</div>
    <div class="device-label" id="device-label">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
      <span>Aguardando...</span>
    </div>
  </div>

  <div class="history-header">
    <span class="history-title">Transcrições</span>
    <div class="history-line"></div>
    <span class="history-count" id="count">0 registros</span>
  </div>

  <div class="empty-state" id="empty-state">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    Nenhuma transcrição ainda.<br>Clique no botão para iniciar a gravação.
  </div>

  <div id="transcriptions"></div>
</main>

<div id="toast"></div>

<script>
  /* ── DOM refs ─────────────────────────── */
  const recCard    = document.getElementById('rec-card');
  const waveform   = document.getElementById('waveform');
  const timerEl    = document.getElementById('timer');
  const recBtn     = document.getElementById('rec-btn');
  const statusPill = document.getElementById('status-pill');
  const deviceLblSpan = document.getElementById('device-label').querySelector('span');
  const connDot    = document.getElementById('conn-dot');
  const countEl    = document.getElementById('count');
  const emptyState = document.getElementById('empty-state');
  const listEl     = document.getElementById('transcriptions');
  const modelSel   = document.getElementById('model-select');
  const toastEl    = document.getElementById('toast');
  const deviceChip = document.getElementById('device-chip');

  /* ── State ────────────────────────────── */
  let ws, isRecording = false;
  let timerInterval, seconds = 0, totalCount = 0;
  const transcriptionStore = new Map(); // id → full data

  /* ── Waveform ─────────────────────────── */
  const peaks  = [14,22,32,26,40,28,18,36,24,42,20,30,16,38];
  const delays = [0,.1,.2,.05,.15,.25,.08,.18,.3,.04,.22,.12,.28,.06];
  peaks.forEach((p, i) => {
    const b = document.createElement('div');
    b.className = 'bar';
    b.style.setProperty('--peak', p + 'px');
    b.style.setProperty('--dur', (.7 + delays[i] * 2).toFixed(2) + 's');
    b.style.animationDelay = delays[i] + 's';
    waveform.appendChild(b);
  });

  /* ── WebSocket ────────────────────────── */
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => {
      connDot.classList.add('online');
      loadPersistedTranscriptions();
    };
    ws.onclose = () => {
      connDot.classList.remove('online');
      setRecording(false);
      setTimeout(connect, 3000);
    };
    ws.onerror = () => toast('Erro na conexão', true);
    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data);
      switch (msg.type) {
        case 'status':               handleStatus(msg); break;
        case 'transcription_start':  createPendingCard(msg); break;
        case 'transcription_progress': updateProgress(msg.id, msg.percent); break;
        case 'transcription_complete': completeCard(msg); break;
        case 'transcription_error':  errorCard(msg.id, msg.message); break;
        case 'model_changed':        syncModel(msg.model); break;
        case 'error':                toast(msg.message, true); break;
      }
    };
  }

  function send(payload) {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify(payload));
  }

  /* ── Status ───────────────────────────── */
  function handleStatus(msg) {
    if (msg.recording) {
      setRecording(true);
    } else {
      setRecording(false);
    }
    if (msg.message) deviceLblSpan.textContent = msg.message;
    if (msg.device) {
      const isGpu = msg.device === 'cuda';
      deviceChip.textContent = isGpu ? 'GPU' : 'CPU';
      deviceChip.className = 'device-chip' + (isGpu ? ' cuda' : '');
    }
  }

  function setRecording(active) {
    isRecording = active;
    recCard.classList.toggle('recording', active);
    recBtn.classList.toggle('recording', active);
    waveform.classList.toggle('active', active);
    if (active) {
      statusPill.textContent = 'Gravando';
      statusPill.className = 'status-pill recording';
      seconds = 0;
      timerEl.textContent = '00:00';
      clearInterval(timerInterval);
      timerInterval = setInterval(() => { seconds++; timerEl.textContent = fmt(seconds); }, 1000);
    } else {
      clearInterval(timerInterval);
      statusPill.textContent = 'Pronto';
      statusPill.className = 'status-pill';
    }
  }

  recBtn.onclick = () => {
    send({ type: 'action', action: isRecording ? 'stop' : 'start' });
  };

  modelSel.onchange = () => send({ type: 'action', action: 'change_model', model: modelSel.value });
  function syncModel(m) { modelSel.value = m; toast(`Modelo: ${m}`); }

  /* ── Pending card (progress) ──────────── */
  function createPendingCard(msg) {
    totalCount++;
    emptyState.style.display = 'none';
    countEl.textContent = totalCount + (totalCount === 1 ? ' registro' : ' registros');

    // Store initial metadata so download functions have timestamp/duration/model
    transcriptionStore.set(msg.id, {
      id: msg.id, timestamp: msg.timestamp, duration: msg.duration,
      model: msg.model, device: msg.device
    });

    const devLabel = (msg.device === 'cuda') ? `<span class="t-device">GPU</span>` : `<span class="t-device cpu">CPU</span>`;

    const card = document.createElement('div');
    card.className = 't-card';
    card.id = 'card-' + msg.id;
    card.innerHTML = `
      <div class="t-card-header">
        <span class="lang-badge pending" id="lang-${msg.id}">...</span>
        <div class="t-meta">
          <div class="dur-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${msg.duration}s
          </div>
          <span class="sep">·</span>
          <span>${escHtml(msg.timestamp)}</span>
          <span class="t-model">${escHtml(msg.model)}</span>
          ${devLabel}
        </div>
      </div>
      <div class="t-progress-area" id="prog-area-${msg.id}">
        <div class="t-progress-wrap">
          <div class="t-progress-bar" id="prog-${msg.id}"></div>
        </div>
        <span class="t-progress-label" id="prog-lbl-${msg.id}">0%</span>
      </div>`;

    listEl.prepend(card);
  }

  function updateProgress(id, pct) {
    const bar = document.getElementById('prog-' + id);
    const lbl = document.getElementById('prog-lbl-' + id);
    if (bar) bar.style.width = pct + '%';
    if (lbl) lbl.textContent = pct + '%';
  }

  /* ── Complete card ────────────────────── */
  function completeCard(msg, titleOverride) {
    // Merge with existing metadata (timestamp/duration/model from createPendingCard)
    const existing = transcriptionStore.get(msg.id) || {};
    transcriptionStore.set(msg.id, { ...existing, ...msg });

    const card = document.getElementById('card-' + msg.id);
    if (!card) return;

    // Update language badge
    const langBadge = document.getElementById('lang-' + msg.id);
    if (langBadge) {
      langBadge.textContent = (msg.language || '?').toUpperCase();
      langBadge.classList.remove('pending');
    }

    // Remove progress area
    const progArea = document.getElementById('prog-area-' + msg.id);
    if (progArea) progArea.remove();

    // Add copy + download + delete to header
    const header = card.querySelector('.t-card-header');
    const actionsHtml = `
      <button class="copy-btn" onclick="copyCard('${msg.id}')">Copiar</button>
      <div class="dl-wrap">
        <button class="dl-btn" onclick="toggleDl(this)">↓ Exportar</button>
        <div class="dl-menu" hidden>
          <button onclick="dlTxt('${msg.id}')">TXT</button>
          <button onclick="dlMd('${msg.id}')">Markdown</button>
          <button onclick="dlVtt('${msg.id}')">VTT</button>
          <button onclick="dlPdf('${msg.id}')">PDF</button>
        </div>
      </div>
      <button class="del-btn" onclick="deleteCard('${msg.id}')" title="Excluir">✕</button>`;
    header.insertAdjacentHTML('beforeend', actionsHtml);

    // Insert title bar between header and body
    const stored = transcriptionStore.get(msg.id);
    const titleText = titleOverride ?? autoTitle(msg.text, stored?.timestamp || msg.timestamp);
    const titleBar = document.createElement('div');
    titleBar.className = 't-title-bar';
    titleBar.innerHTML = `
      <svg class="t-title-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <div class="t-title"
           contenteditable="true"
           spellcheck="false"
           data-placeholder="Clique para nomear..."
           onblur="saveTitle('${msg.id}', this)"
           onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${escHtml(titleText)}</div>`;
    card.appendChild(titleBar);

    // Add text body
    const text = msg.text?.trim() || '';
    const body = document.createElement('div');
    body.className = 't-card-body';
    body.innerHTML = `<div class="t-text${text ? '' : ' empty'}">${escHtml(text || '(sem texto detectado)')}</div>`;
    card.appendChild(body);
  }

  function errorCard(id, message) {
    const card = document.getElementById('card-' + id);
    if (!card) return;
    card.classList.add('error');
    const progArea = document.getElementById('prog-area-' + id);
    if (progArea) progArea.remove();
    const err = document.createElement('div');
    err.className = 't-error-msg';
    err.textContent = '⚠ ' + message;
    card.appendChild(err);
  }

  /* ── Title / Delete / Persistence ────── */
  function autoTitle(text, timestamp) {
    if (!text || !text.trim()) return ('Transcrição ' + (timestamp || '')).trim();
    const words = text.trim().split(/\s+/);
    return words.slice(0, 7).join(' ') + (words.length > 7 ? '...' : '');
  }

  async function saveTitle(id, el) {
    const title = el.textContent.trim();
    const d = transcriptionStore.get(id);
    if (d) d.title = title;
    await fetch(`/transcriptions/${id}/title`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    }).catch(() => {});
  }

  async function deleteCard(id) {
    if (!confirm('Excluir esta transcrição?')) return;
    await fetch(`/transcriptions/${id}`, { method: 'DELETE' }).catch(() => {});
    document.getElementById('card-' + id)?.remove();
    transcriptionStore.delete(id);
    totalCount--;
    const n = transcriptionStore.size;
    countEl.textContent = n + (n === 1 ? ' registro' : ' registros');
    if (n === 0) emptyState.style.display = '';
  }

  async function loadPersistedTranscriptions() {
    try {
      const res = await fetch('/transcriptions');
      if (!res.ok) return;
      const items = await res.json();
      items.forEach(item => {
        createPendingCard({ ...item, fromDisk: true });
        completeCard(item, item.title || autoTitle(item.text, item.timestamp));
      });
    } catch(e) {
      console.warn('Erro ao carregar transcrições:', e);
    }
  }

  /* ── Download dropdown ────────────────── */
  function toggleDl(btn) {
    const menu = btn.nextElementSibling;
    const isOpen = !menu.hidden;
    // close all others
    document.querySelectorAll('.dl-menu').forEach(m => m.hidden = true);
    menu.hidden = isOpen;
    if (!isOpen) {
      const closeOnClick = e => {
        if (!btn.closest('.dl-wrap').contains(e.target)) {
          menu.hidden = true;
          document.removeEventListener('click', closeOnClick);
        }
      };
      setTimeout(() => document.addEventListener('click', closeOnClick), 0);
    }
  }

  function getData(id) { return transcriptionStore.get(id); }

  function dlBlob(content, filename, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type: mime }));
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function dlTxt(id) {
    const d = getData(id); if (!d) return;
    const header = `Transcrição — ${d.timestamp}\nDuração: ${getCardDuration(id)}s | Idioma: ${(d.language||'?').toUpperCase()} | Modelo: ${getCardModel(id)}\n${'─'.repeat(60)}\n\n`;
    dlBlob(header + (d.text || ''), `transcricao_${id}.txt`, 'text/plain');
  }

  function dlMd(id) {
    const d = getData(id); if (!d) return;
    let md = `---\ndata: ${d.timestamp}\nduracao: ${getCardDuration(id)}s\nidioma: ${(d.language||'?').toUpperCase()}\nmodelo: ${getCardModel(id)}\n---\n\n# Transcrição\n\n${d.text || ''}\n`;
    if (d.segments && d.segments.length > 0) {
      md += `\n## Segmentos\n\n| Início | Fim | Texto |\n|--------|-----|-------|\n`;
      d.segments.forEach(s => {
        md += `| ${toVttTime(s.start)} | ${toVttTime(s.end)} | ${s.text} |\n`;
      });
    }
    dlBlob(md, `transcricao_${id}.md`, 'text/markdown');
  }

  function dlVtt(id) {
    const d = getData(id); if (!d) return;
    if (!d.segments || d.segments.length === 0) {
      toast('Sem segmentos para VTT', true); return;
    }
    let vtt = 'WEBVTT\n\n';
    d.segments.forEach((s, i) => {
      vtt += `${i + 1}\n${toVttTime(s.start)} --> ${toVttTime(s.end)}\n${s.text}\n\n`;
    });
    dlBlob(vtt, `transcricao_${id}.vtt`, 'text/vtt');
  }

  function dlPdf(id) {
    const d = getData(id); if (!d) return;
    const dur = getCardDuration(id);
    const lang = (d.language || '?').toUpperCase();
    const model = getCardModel(id);
    const text = (d.text || '(sem texto)').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    let segHtml = '';
    if (d.segments && d.segments.length > 0) {
      segHtml = `<h3>Segmentos</h3><table><tr><th>Início</th><th>Fim</th><th>Texto</th></tr>` +
        d.segments.map(s => `<tr><td>${toVttTime(s.start)}</td><td>${toVttTime(s.end)}</td><td>${s.text.replace(/</g,'&lt;')}</td></tr>`).join('') +
        `</table>`;
    }

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Transcrição ${id}</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 40px auto; color: #1a1a2e; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .meta { color: #666; font-size: .85rem; margin-bottom: 24px; }
  .text-body { line-height: 1.7; font-size: 1rem; white-space: pre-wrap; border-left: 3px solid #7c6fff; padding-left: 16px; margin-bottom: 32px; }
  h3 { margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  td, th { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
  th { background: #f0f0f8; }
  @media print { body { margin: 20px; } }
</style></head><body>
<h1>Transcrição</h1>
<div class="meta">${d.timestamp} &nbsp;·&nbsp; ${dur}s &nbsp;·&nbsp; ${lang} &nbsp;·&nbsp; ${model}</div>
<div class="text-body">${text}</div>
${segHtml}
</body></html>`;

    const w = window.open('', '_blank');
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 400);
  }

  /* ── Helpers ──────────────────────────── */
  function getCardDuration(id) {
    const card = document.getElementById('card-' + id);
    if (!card) return '?';
    const dur = card.querySelector('.dur-badge');
    return dur ? dur.textContent.trim().replace('s','').trim() : '?';
  }
  function getCardModel(id) {
    const card = document.getElementById('card-' + id);
    if (!card) return '?';
    const m = card.querySelector('.t-model');
    return m ? m.textContent.trim() : '?';
  }

  function copyCard(id) {
    const d = getData(id);
    if (!d) return;
    const btn = document.querySelector(`#card-${id} .copy-btn`);
    navigator.clipboard.writeText(d.text || '').then(() => {
      if (btn) { btn.textContent = 'Copiado!'; btn.classList.add('copied'); }
      setTimeout(() => { if (btn) { btn.textContent = 'Copiar'; btn.classList.remove('copied'); } }, 2000);
    });
  }

  function toVttTime(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = (s % 60).toFixed(3);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(6,'0')}`;
  }

  function fmt(s) {
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let toastTimer;
  function toast(msg, isError = false) {
    toastEl.textContent = msg;
    toastEl.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.className = '', 3000);
  }

  connect();

  // Close dropdown on outside click
  document.addEventListener('click', e => {
    if (!e.target.closest('.dl-wrap'))
      document.querySelectorAll('.dl-menu').forEach(m => m.hidden = true);
  });
</script>
</body>
</html>
